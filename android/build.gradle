allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// record_android 등 flutter.compileSdkVersion에 의존하는 플러그인 호환 처리
subprojects {
    project.ext {
        flutter = [
            compileSdkVersion: 35,
            targetSdkVersion : 35,
            minSdkVersion    : 23,
        ]
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
